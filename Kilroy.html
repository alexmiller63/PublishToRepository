<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kilroy Was Here</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f0e6;
      color: #111;
      font-family: Georgia, 'Times New Roman', serif;
    }
    main {
      width: min(92vw, 900px);
      text-align: center;
      padding: 48px 24px;
    }
    img {
      display: block;
      width: min(520px, 90vw);
      height: auto;
      margin: 0 auto 28px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 5.5rem);
      letter-spacing: 0.06em;
      line-height: 0.95;
      text-transform: uppercase;
    }
    p {
      margin: 20px 0 0;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img src="images/kilroy-web.PNG" alt="Kilroy peeking over a wall">
    <h1>Kilroy Was Here!</h1>
    <p>Safe text publish test — binaries are verboten!</p>
  </main>
</body>
</html>
