name: Publish to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch publish bridge
        run: |
          DOC_ID="$(tr -d '[:space:]' < tools/id.txt)"

          if [ -z "$DOC_ID" ]; then
            echo "tools/id.txt is empty"
            exit 1
          fi

          curl --fail --location --silent --show-error \
            "https://docs.google.com/document/d/${DOC_ID}/export?format=txt" \
            --output /tmp/publish-bridge.txt

      - name: Apply changes from bridge
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import json
          from pathlib import Path

          bridge = Path("/tmp/publish-bridge.txt")

          request = json.loads(
              bridge.read_text(
                  encoding="utf-8-sig"
              ).strip()
          )

          if not isinstance(request, dict):
              raise SystemExit(
                  "Bridge must contain a JSON object"
              )

          files = request.get("files", [])
          delete = request.get("delete", [])

          if not isinstance(files, list):
              raise SystemExit(
                  "files must be an array"
              )

          if not isinstance(delete, list):
              raise SystemExit(
                  "delete must be an array"
              )

          if not files and not delete:
              raise SystemExit(
                  "Bridge must contain files or delete entries"
              )

          root = Path.cwd().resolve()

          def resolve_repository_path(path):
              if not isinstance(path, str) or not path.strip():
                  raise SystemExit(
                      "Repository path must be a non-empty string"
                  )

              target = (root / path).resolve()

              try:
                  target.relative_to(root)
              except ValueError:
                  raise SystemExit(
                      "Refusing path outside "
                      f"repository: {path}"
                  )

              return target

          for item in files:
              if not isinstance(item, dict):
                  raise SystemExit(
                      "Invalid file entry"
                  )

              path = item.get("path")
              content_base64 = item.get(
                  "content_base64"
              )

              target = resolve_repository_path(
                  path
              )

              if not isinstance(
                  content_base64,
                  str
              ):
                  raise SystemExit(
                      f"File {path} is missing "
                      "content_base64"
                  )

              try:
                  content_bytes = (
                      base64.b64decode(
                          content_base64,
                          validate=True
                      )
                  )
              except (
                  binascii.Error,
                  ValueError
              ) as exc:
                  raise SystemExit(
                      f"Invalid Base64 content "
                      f"for {path}: {exc}"
                  )

              try:
                  content_bytes.decode(
                      "utf-8"
                  )
              except UnicodeDecodeError as exc:
                  raise SystemExit(
                      f"File {path} is not valid "
                      f"UTF-8 text: {exc}"
                  )

              target.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              target.write_bytes(
                  content_bytes
              )

              print(
                  f"Wrote {path} "
                  f"({len(content_bytes)} bytes)"
              )

          for path in delete:
              target = resolve_repository_path(
                  path
              )

              if not target.exists():
                  raise SystemExit(
                      f"Cannot delete missing file: {path}"
                  )

              if not target.is_file():
                  raise SystemExit(
                      f"Refusing to delete non-file: {path}"
                  )

              target.unlink()

              print(
                  f"Deleted {path}"
              )

          commit_message = str(
              request.get(
                  "commit_message",
                  "Publish repository changes"
              )
          ).strip()

          if not commit_message:
              commit_message = (
                  "Publish repository changes"
              )

          Path(
              "/tmp/commit-message.txt"
          ).write_text(
              commit_message,
              encoding="utf-8"
          )
          PY

      - name: Commit and push
        run: |
          if git diff --quiet && \
             [ -z "$(git status --porcelain)" ]; then
            echo "No repository changes to commit."
            exit 0
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          git commit -F /tmp/commit-message.txt
          git push