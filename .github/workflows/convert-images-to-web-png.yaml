name: Convert Images to Web PNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow pillow-heif

      - name: Normalize web PNG filenames
        run: |
          find images -maxdepth 1 -type f -name '*-web.PNG' -print0 |
          while IFS= read -r -d '' source; do
            destination="${source%.PNG}.png"

            if [ -e "$destination" ]; then
              echo "ERROR: cannot rename because destination already exists:"
              echo "  $source"
              echo "  $destination"
              exit 1
            fi

            echo "Renaming: $source"
            echo "      to: $destination"
            mv -- "$source" "$destination"
          done

      - name: Convert images to web PNG
        run: |
          python tools/convert-images-to-web-png.py \
            --input-dir images \
            --output-dir images

      - name: Commit generated and normalized web PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A images

          if git diff --cached --quiet; then
            echo "No web PNG changes to commit."
            exit 0
          fi

          git commit -m "Generate and normalize web PNG images"
          git push